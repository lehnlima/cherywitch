<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cheer'y Witch</title>
  <link rel="icon" href="img/Icon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="container nav">
      <div class="brand">
      <img src="img/Icon.png" class="logo"/><span>Cheer'y Witch</span></div>
      <nav class="menu" aria-label="Principal">
        <a href="index.html">Home</a>
        <a href="press-release.html">Press Release</a>
        <a href="contato.html">Contato</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1>Contato</h1>
      <form id="contact-form" action="#" method="POST">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" required />

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required />

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" required></textarea>

        <button class="btn primary" type="submit" style="display: flex; align-content: center;justify-content: center;" >Enviar</button>
      </form>
    </section>
    <div id="form-message" style="display:none; margin-top:16px; color:#90a2ee;">
      Mensagem enviada com sucesso!
    </div>
  </main>

  <footer class="footer">
    <img src="img/fc.png" alt="Logo Cher'y Witch" width="200" height="201" loading="lazy">
    <p>© <span id="year"></span> Cheer'y Witch. Todos os direitos reservados.</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const form = document.getElementById("contact-form");
    const message = document.getElementById("form-message");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      message.style.display = "block";
      form.reset();
      setTimeout(() => {
        message.style.display = "none";
      }, 4000);
    });
  </script>
  
</body>
</html>
